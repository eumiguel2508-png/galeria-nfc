<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3d2b">
  <title>Guaramiranga • Suas memórias aqui!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-img">
      <!-- Foto de destaque: coloque o arquivo em assets/capa.jpg -->
      <img src="assets/capa.jpg" alt="" onerror="this.remove()">
    </div>
    <div class="hero-text">
      <h1>Guaramiranga</h1>
      <p class="sub">CEARÁ • BRASIL</p>
      <p class="tagline">Suas memórias aqui!</p>
    </div>
  </header>

  <main class="panel" id="panel">
    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="grid" role="tab">Galeria</button>
      <button class="tab" data-mode="stories" role="tab">Stories</button>
    </div>
    <p class="counter" id="counter"></p>
    <p class="notice" id="notice" hidden></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Ainda não há fotos nesta galeria. Toque na câmera para enviar as primeiras.</p>
  </main>

  <button class="fab" id="fab" aria-label="Adicionar fotos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
  </button>
  <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden>

  <div class="overlay" id="lightbox" hidden>
    <div class="lb-img"><img id="lbImg" alt=""></div>
    <div class="lb-actions">
      <button class="btn primary" id="lbDownload">Baixar</button>
      <button class="btn danger" id="lbDelete">Excluir</button>
      <button class="btn" id="lbClose">Fechar</button>
    </div>
  </div>

  <div class="stories" id="stories" hidden>
    <div class="bars" id="bars"></div>
    <img id="storyImg" alt="">
    <button class="zone left" id="prev" aria-label="Foto anterior"></button>
    <button class="zone right" id="next" aria-label="Próxima foto"></button>
    <button class="close" id="closeStories" aria-label="Fechar">×</button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="galeria.js"></script>
</body>
</html>
